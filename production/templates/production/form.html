{% extends "base.html" %}
{% block content %}
<style>
  .po-form { display:grid; grid-template-columns: repeat(2, 1fr); gap:14px 20px; max-width:760px; }
  .po-form label { display:block; font-size:.85rem; margin-bottom:4px; }
  .po-form input, .po-form select, .po-form textarea { width:100%; padding:8px; box-sizing:border-box; }
  .po-form .full, .po-form .actions { grid-column: 1 / -1; }
  .po-form .errorlist { color:#b91c1c; margin:0 0 4px; padding:0; list-style:none; font-size:.8rem; }
  @media (max-width:700px) { .po-form { grid-template-columns: 1fr; } }
</style>
<h2>Production Order — {% if object %}{{ object.order_no }} Edit{% else %}New{% endif %}</h2>
<form method="post" class="po-form">
  {% csrf_token %}
  {% for f in form %}
  <div class="{% if f.name == 'notes' %}full{% endif %}">{{ f.errors }}<label>{{ f.label }}</label>{{ f }}</div>
  {% endfor %}
  <div class="actions"><button type="submit">Save</button> <a href="{% url 'production:list' %}">Cancel</a></div>
</form>
{% endblock %}
