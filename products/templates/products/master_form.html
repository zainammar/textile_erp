{% extends "base.html" %}
{% block content %}
<style>
  .ms-form { display:grid; grid-template-columns: repeat(2, 1fr); gap:14px 20px; max-width:640px; }
  .ms-form label { display:block; font-size:.85rem; margin-bottom:4px; }
  .ms-form input:not([type=checkbox]), .ms-form select { width:100%; padding:8px; box-sizing:border-box; }
  .ms-form .actions { grid-column: 1 / -1; }
  .ms-form .errorlist { color:#b91c1c; margin:0 0 4px; padding:0; list-style:none; font-size:.8rem; }
  @media (max-width:700px) { .ms-form { grid-template-columns: 1fr; } }
</style>
<h2>{{ title }} — {% if object %}Edit{% else %}Add{% endif %}</h2>
<form method="post" class="ms-form">
  {% csrf_token %}
  {% for f in form %}<div>{{ f.errors }}<label>{{ f.label }}</label>{{ f }}</div>{% endfor %}
  <div class="actions"><button type="submit">Save</button> <a href="{% url 'products:'|add:name %}">Cancel</a></div>
</form>
{% endblock %}
